    <text x="604.0" y="599.1" text-anchor="middle"
          font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="10.5" fill="#dc2626">4,6 m (> 4,0 m)</text>
    
  
    <line x1="432.0" y1="260.0" x2="545.8" y2="229.8"
          stroke="#1d4ed8" stroke-width="2.4" marker-start="url(#arrow-1d4ed8)" marker-end="url(#arrow-1d4ed8)"/>
    <rect x="410.9" y="208.4" width="132" height="21"
