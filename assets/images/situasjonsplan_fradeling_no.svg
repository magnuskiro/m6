    <line x1="575.0" y1="625.0" x2="641.0" y2="609.3"
          stroke="#dc2626" stroke-width="2.4" marker-start="url(#arrow-dc2626)" marker-end="url(#arrow-dc2626)"/>
    <rect x="553.0" y="584.1" width="102" height="22"
