  <circle cx="432.0" cy="260.0" r="7" fill="#2563eb" stroke="#ffffff" stroke-width="2"/>
  <circle cx="595.0" cy="642.0" r="6.5" fill="#0284c7" stroke="#ffffff" stroke-width="2"/>

