  <polygon points="814.0,335.9 690.2,367.9 772.6,710.9 896.4,678.9" fill="#3b82f6" fill-opacity="0.16" stroke="#1d4ed8" stroke-width="2.0" stroke-dasharray="5,4"/>
  <polygon points="814.0,335.9 690.2,367.9 772.6,710.9 896.4,678.9" fill="url(#dots-build)" stroke="none"/>

  <!-- 3. Foreslått ny avkjørsel -->
  <polygon points="669.7,188.0 612.7,202.7 644.3,334.2 701.3,319.5" fill="#f59e0b" fill-opacity="0.50" stroke="#b45309" stroke-width="2.2"/>

