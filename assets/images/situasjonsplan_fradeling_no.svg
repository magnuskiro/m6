  <!-- 1. Planlagt innkjøring M6 (#92) -->
  <polygon points="425.0,650.0 335.0,283.0 432.0,260.0 575.0,625.0" fill="#94a3b8" fill-opacity="0.28" stroke="#475569" stroke-width="1.8" stroke-dasharray="6,4"/>
  <polygon points="425.0,650.0 335.0,283.0 432.0,260.0 575.0,625.0" fill="url(#hatch-drive)" stroke="none"/>

  <!-- 2. Foreslått ny parsell (~650 m²) -->
  <polygon points="832.6,157.2 545.8,229.8 662.8,696.1 949.6,623.5" fill="#10b981" fill-opacity="0.24" stroke="#047857" stroke-width="2.5"/>

  <!-- 3. Dispensasjonsfritt byggefelt (12,0 x 17,5 m = 210 m²) -->
  <polygon points="814.9,329.5 642.8,373.1 705.8,624.2 877.8,580.6" fill="#3b82f6" fill-opacity="0.18" stroke="#1d4ed8" stroke-width="2.0" stroke-dasharray="5,4"/>
  <polygon points="814.9,329.5 642.8,373.1 705.8,624.2 877.8,580.6" fill="url(#dots-build)" stroke="none"/>

