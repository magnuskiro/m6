  <circle cx="833.2" cy="163.9" r="5.5" fill="#dc2626" stroke="#ffffff" stroke-width="2"/><circle cx="595.5" cy="225.4" r="5.5" fill="#dc2626" stroke="#ffffff" stroke-width="2"/><circle cx="729.4" cy="782.8" r="5.5" fill="#dc2626" stroke="#ffffff" stroke-width="2"/><circle cx="967.1" cy="721.3" r="5.5" fill="#dc2626" stroke="#ffffff" stroke-width="2"/>

