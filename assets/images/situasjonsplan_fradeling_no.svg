  <!-- 1. Foreslått ny parsell (16,7 x 39,0 m = ca. 651 m²) -->
  <polygon points="833.2,163.9 595.5,225.4 729.4,782.8 967.1,721.3" fill="#10b981" fill-opacity="0.22" stroke="#047857" stroke-width="2.4"/>

